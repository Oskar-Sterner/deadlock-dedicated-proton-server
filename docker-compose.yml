services:
  deadlock:
    restart: always
    container_name: deadlock
    image: deadlock-server
    volumes:
      - ./server:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/machine-id:/etc/machine-id:ro
    environment:
      - PORT=${PORT}
      - SERVER_PASSWORD=${SERVER_PASSWORD}
      - MAP=${MAP}
      - STEAM_LOGIN=${STEAM_LOGIN}
      - STEAM_PASSWORD=${STEAM_PASSWORD}
      - STEAM_2FA_CODE=${STEAM_2FA_CODE}
      - SKIP_UPDATE=${SKIP_UPDATE}
      - DISPLAY=:99
      # Rendering optimizations are baked into the Docker image.
      # Override here only if you need to tune specific values.
      # LP_NUM_THREADS=2        # llvmpipe CPU threads (default: 2)
    ports:
      - "${PORT:-27015}:${PORT:-27015}/tcp"
      - "${PORT:-27015}:${PORT:-27015}/udp"
